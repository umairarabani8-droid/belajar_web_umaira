<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kartu Profil</title>
</head>
<body>
    <style>
        body {
            background-color: #f4f4f4;
            font-family: Arial, sans-serif;
        }
        .kartu {
            background-color: white;
            width: 300px;
            margin: 50px auto;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            border: 1px solid #ddd;
        }
        .foto {
            border-radius: 60%;
            width: 150px;
        }
        .pekerjaan {
            color: gray;
            margin-top: -10px;
        }
        .btn-kontak {
            background-color: #ea99fa;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 25px;
            font-size: 15px;
            cursor: pointer;
        }
        .btn-kontak:hover {
            background-color: #99c3fa;
        }
    </style>
</head>
<body>
    <div class="kartu">
        <img src="foto gue.jpg" alt="Foto Profil" class="foto">
        <h2>Myra_Jn</h2>
        <p class="pekerjaan">Web Developer</p>
        <p>Siswa XI RPL yang bercita-cita membuat startup teknologi di Indonesia.</p>
        <button class="btn-kontak">Hubungi Saya</button>
    </div>
</body>
</html>
</body>
</html>
